<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Line Translator</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>AI Line Translator</h1><p class="hint">网页音频实时双语字幕</p><div class="actions"><button id="start">开始捕获</button><button id="stop" class="secondary">暂停</button></div><label>目标语言<select id="targetLanguage"><option value="Chinese">中文</option><option value="English">English</option><option value="Japanese">日本語</option><option value="Korean">한국어</option><option value="French">Français</option><option value="Spanish">Español</option></select></label><details><summary>Provider 设置</summary><label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在本机浏览器"></label><label>ASR Base URL<input id="asrBaseUrl" placeholder="https://api.openai.com/v1"></label><label>ASR Model<input id="asrModel" placeholder="whisper-1"></label><label>翻译 Base URL<input id="translationBaseUrl" placeholder="默认使用 ASR 地址"></label><label>翻译 Model<input id="translationModel" placeholder="gpt-4o-mini"></label><button id="save" class="secondary">保存设置</button></details><p id="status" role="status"></p><p class="foot">首次使用需配置兼容接口和 API Key。密钥不会写入仓库。</p></main><script src="popup.js"></script></body></html>
