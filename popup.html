<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Line Translator</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>AI Line Translator</h1><p class="hint">网页音频实时双语字幕</p><div class="actions"><button id="startReader">读取网页字幕</button><button id="stopReader" class="secondary">停止读取</button></div><div class="actions"><button id="start">音频识别（需 API）</button><button id="stop" class="secondary">暂停音频</button></div><label>目标语言<select id="targetLanguage"><option value="Chinese">中文</option><option value="English">English</option><option value="Japanese">日本語</option><option value="Korean">한국어</option><option value="French">Français</option><option value="Spanish">Español</option></select></label><label>字幕显示<select id="subtitleMode"><option value="both">原文 + 中文（默认）</option><option value="zh">仅中文</option><option value="original">仅原文</option></select></label><label><input type="checkbox" id="subtitleVisible" checked> 显示悬浮字幕</label><details><summary>Provider 设置</summary><label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在本机浏览器"></label><label>ASR Base URL<input id="asrBaseUrl" placeholder="https://api.openai.com/v1"></label><label>ASR Model<input id="asrModel" placeholder="whisper-1"></label><label>微软翻译 Key<input id="azureTranslatorKey" type="password" placeholder="Azure Translator resource key"></label><label>微软区域<input id="azureTranslatorRegion" placeholder="例如 eastus，部分资源需要"></label><label>Google 翻译 Key<input id="googleTranslateKey" type="password" placeholder="可选备用"></label><label>翻译 Base URL<input id="translationBaseUrl" placeholder="默认使用 ASR 地址"></label><label>翻译 Model<input id="translationModel" placeholder="gpt-4o-mini"></label><button id="save" class="secondary">保存设置</button></details><p id="status" role="status"></p><p class="foot">字幕读取模式无需 ASR Key；网页翻译服务可能限流。模型 API 设置仅用于音频识别备用。</p></main><script src="popup.js"></script></body></html>
